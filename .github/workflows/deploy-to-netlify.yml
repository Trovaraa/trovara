name: Deploy to Netlify

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-netlify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Lint
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run all tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          JOURNAL_API_URL: https://os.trovara.farm/public/journal

      # Netlify's CLI follows local imports and adds the runtime bootstrap.
      # The previous raw uploader omitted both and every form function crashed.
      - name: Deploy production to Netlify
        if: github.event_name != 'pull_request'
        run: >-
          npx --yes netlify-cli@27.1.1 deploy
          --prod
          --skip-functions-cache
          --context production
          --dir dist
          --functions netlify/deploy-functions
          --site "$NETLIFY_SITE_ID"
          --auth "$NETLIFY_AUTH_TOKEN"
          --message "Deploy from GitHub Actions ($GITHUB_SHA)"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      - name: Deploy preview to Netlify
        if: github.event_name == 'pull_request'
        run: >-
          npx --yes netlify-cli@27.1.1 deploy
          --skip-functions-cache
          --context deploy-preview
          --alias "deploy-preview-${{ github.event.number }}"
          --dir dist
          --functions netlify/deploy-functions
          --site "$NETLIFY_SITE_ID"
          --auth "$NETLIFY_AUTH_TOKEN"
          --message "Preview from GitHub Actions ($GITHUB_SHA)"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5

      - name: Smoke test deployed form functions
        env:
          FUNCTION_BASE_URL: ${{ github.event_name == 'pull_request' && format('https://deploy-preview-{0}--trovara.netlify.app', github.event.number) || 'https://www.trovara.farm' }}
        run: node scripts/smoke-netlify-functions.mjs

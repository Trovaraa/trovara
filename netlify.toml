[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/deploy-functions"

[build.environment]
  NODE_VERSION = "22"
  JOURNAL_API_URL = "https://os.trovara.farm/public/journal"

[context.production.environment]
  NEWSLETTER_API_URL = "https://os.trovara.farm/public/newsletter"
  MARKETING_LEADS_API_URL = "https://os.trovara.farm/public/leads"

# Proxy customer shop API to Trovara OS (same-origin cookies + CSP connect-src 'self').
# Must stay above the SPA fallback.
[[redirects]]
  from   = "/shop-api/*"
  to     = "https://os.trovara.farm/shop/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Also kept in public/_headers, which ships inside the publish directory. A
# check on 26 July 2026 found the live site serving none of these headers, the
# same reason public/_redirects duplicates the redirect below.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://analytics.webmetrix.ai; worker-src 'self'; manifest-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://analytics.webmetrix.ai; upgrade-insecure-requests"

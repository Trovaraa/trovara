[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/deploy-functions"

[build.environment]
  NODE_VERSION = "22"
  JOURNAL_API_URL = "https://os.trovara.farm/public/journal"
  CAREERS_API_URL = "https://os.trovara.farm/public/careers"

[context.production.environment]
  NEWSLETTER_API_URL = "https://os.trovara.farm/public/newsletter"
  MARKETING_LEADS_API_URL = "https://os.trovara.farm/public/leads"

# Proxy customer shop API to Trovara OS (same-origin cookies + CSP connect-src 'self').
# Production URLs live in public/_redirects (copied into dist). Do not hardcode
# os.trovara.farm here — `netlify dev --dir dist` would then ignore local OS.
# For local netlify: npm run dev:netlify (rewrites dist/_redirects → 127.0.0.1:3000).
# For Vite-only local: npm run dev (vite.config.ts proxies /shop-api and /lot-api).

[[redirects]]
  from   = "/brand/*"
  to     = "/brand-shell.html"
  status = 200

[[redirects]]
  from   = "/lot/*"
  to     = "/lot-shell.html"
  status = 200

[[redirects]]
  from   = "/blog"
  to     = "/journal"
  status = 301

[[redirects]]
  from   = "/blog/*"
  to     = "/journal/:splat"
  status = 301

[[redirects]]
  from   = "/images/blog/*"
  to     = "/images/journal/:splat"
  status = 301

[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

# Canonical security headers for Netlify. Do not reintroduce public/_headers —
# that file duplicated these values and caused dual-source drift. (SPA redirects
# still live in both [[redirects]] above and public/_redirects for publish-dir
# fallback; that is intentional and separate from CSP/HSTS.)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://analytics.webmetrix.ai; worker-src 'self'; manifest-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://analytics.webmetrix.ai; upgrade-insecure-requests"

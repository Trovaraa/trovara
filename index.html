<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var key = 'trovara-color-scheme'
          var stored = localStorage.getItem(key)
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored === 'dark' || ((stored === 'auto' || stored == null) && prefersDark)
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/brand/trovara-monogram-tile-v1.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Trovara Farm - Food you can trust, from a farm built for tomorrow. Premium coconuts, plantains, and free-range dressed noilers & mature hens from the heart of the earth." />
    <meta name="theme-color" content="#1A6B3C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Trovara" />
    <meta property="og:title" content="Trovara Farm" />
    <meta property="og:description" content="Food you can trust, from a farm built for tomorrow." />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/trovara-monogram-icon-v1.svg" />
    <link rel="alternate" type="application/rss+xml" title="Trovara Farm Blog" href="/feed.xml" />
    <title>Trovara Farm - Food you can trust, from a farm built for tomorrow</title>
  </head>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

# Gitleaks config for Trovara marketing CI.
# Extends defaults; allowlists known false positives (not real secrets).

title = "trovera"

[extend]
useDefault = true

[allowlist]
description = "Exact non-secret browser storage namespaces; scan documentation and source"
regexes = [
  '''^trovara-a2hs-dismissed-until$''',
  # Public sessionStorage namespace; not authentication material.
  '''^trovara-food-survey-v1$''',
]
